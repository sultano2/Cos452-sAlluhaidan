<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Week 9 Starter -- Textures</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <script>
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    const vertexSource = `#version 300 es
      in vec2 a_position;
      in vec2 a_uv;
      out vec2 v_uv;
      void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
        v_uv = a_uv;
      }`;

    const fragmentSource = `#version 300 es
      precision mediump float;
      in vec2 v_uv;
      uniform sampler2D u_texture;
      out vec4 outColor;
      void main() { outColor = texture(u_texture, v_uv); }`;

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error("Shader failed to compile: " + gl.getShaderInfoLog(shader));
      }
      return shader;
    }
    function createProgram(gl, vsSource, fsSource) {
      const program = gl.createProgram();
      gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error("Program failed to link: " + gl.getProgramInfoLog(program));
      }
      return program;
    }

    const program = createProgram(gl, vertexSource, fragmentSource);

    // interleaved: x, y, u, v
    // TODO(student) (c): change every 1 in the UVs (the u, v columns) to 2 so the
    // UVs run past 1.0; otherwise REPEAT and CLAMP_TO_EDGE look the same.
    const data = new Float32Array([
      -0.7,-0.7, 0,0,   0.7,-0.7, 2,0,   0.7,0.7, 2,2,
      -0.7,-0.7, 0,0,   0.7, 0.7, 2,2,  -0.7,0.7, 0,2,
    ]);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const F = Float32Array.BYTES_PER_ELEMENT, stride = 4 * F;
    const aPosition = gl.getAttribLocation(program, "a_position");
    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, stride, 0);
    const aUV = gl.getAttribLocation(program, "a_uv");
    gl.enableVertexAttribArray(aUV);
    gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, stride, 2 * F);
    const uTexture = gl.getUniformLocation(program, "u_texture");

    const texture = gl.createTexture();
    const image = new Image();
    image.onload = () => {
      gl.bindTexture(gl.TEXTURE_2D, texture);
      // TODO(student) (b): comment out the next line and reload. In a comment,
      // explain why the image is upside down without it, and name the other fix
      ////// the image turns upside down due to the image row starting on the top but webGL uses the bottom for v=0
      //// one way to fix is to flip v and have coordiante 1-v
      //(flip V in the UVs: v becomes 1 - v). Then turn it back on.
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
      // TODO(student) (c): try REPEAT vs CLAMP_TO_EDGE (both lines), then NEAREST vs
      // LINEAR for MAG_FILTER. Describe each visual difference in a comment.
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);

      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      render();
    };
    // TODO(student) (a): put your own image (PNG or JPG) next to index.html and
    // set its file name here.
    image.src = "orangeCAT.jpg"; // must be served over http (Live Server)

    function render() {
      const dpr = window.devicePixelRatio || 1;
      const w = Math.round(canvas.clientWidth * dpr);
      const h = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, canvas.width, canvas.height);

      gl.useProgram(program);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.uniform1i(uTexture, 0);

      gl.clearColor(0.10, 0.12, 0.16, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }

    render(); // draws before the image loads; render() runs again on image.onload

    // TODO(student) (d): commit the image with index.html, open your Pages URL,
    // and check the console (F12). File names are case-sensitive on Pages.
  </script>
</body>
</html>
